<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0, user-scalable=no" name="viewport">
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a2e; }
        canvas { display: block; }
        #info { position: absolute; top: 10px; left: 10px; color: #aaa; font: 12px monospace; }
        #wireframeBtn { position: absolute; bottom: 20px; right: 20px; background: rgba(255,255,255,0.15);
          color: #fff; border: 1px solid rgba(255,255,255,0.3); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; }
        #wireframeBtn:active { background: rgba(255,255,255,0.3); }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: #fff; font: 16px sans-serif; }
    </style>
</head>
<body>
<div id="info">Drag to rotate | Pinch to zoom</div>
<div id="loading">Loading 3D Model...</div>
<button id="wireframeBtn">Wireframe</button>
<script src="js/three.min.js"></script>
<script src="js/OrbitControls.js"></script>
<script src="js/OBJLoader.js"></script>
<script>
    var scene, camera, renderer, controls, mesh, isWireframe = false;

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1a2e);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(3, 2, 3);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      document.body.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      var ambient = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambient);
      var dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(5, 10, 5);
      scene.add(dirLight);
      var dirLight2 = new THREE.DirectionalLight(0xffffff, 0.3);
      dirLight2.position.set(-5, -5, -5);
      scene.add(dirLight2);

      var grid = new THREE.GridHelper(10, 20, 0x444466, 0x333355);
      scene.add(grid);

      document.getElementById('wireframeBtn').addEventListener('click', toggleWireframe);
      window.addEventListener('resize', onResize);
      animate();
    }

    function toggleWireframe() {
      if (!mesh) return;
      isWireframe = !isWireframe;
      mesh.traverse(function(child) {
        if (child.isMesh) {
          child.material.wireframe = isWireframe;
        }
      });
      document.getElementById('wireframeBtn').textContent = isWireframe ? 'Solid' : 'Wireframe';
    }

    function clearMesh() {
      if (mesh) {
        scene.remove(mesh);
        mesh.traverse(function(child) {
          if (child.isMesh) {
            child.geometry.dispose();
            child.material.dispose();
          }
        });
        mesh = null;
      }
    }

    function setLoading(text) {
      var el = document.getElementById('loading');
      if (el) { el.style.display = 'block'; el.textContent = text; }
    }

    function hideLoading() {
      var el = document.getElementById('loading');
      if (el) { el.style.display = 'none'; }
    }

    function addModelToScene(object) {
      object.traverse(function(child) {
        if (child.isMesh) {
          child.material = new THREE.MeshStandardMaterial({
            color: 0xe94560,
            metalness: 0.3,
            roughness: 0.6,
            wireframe: isWireframe
          });
        }
      });

      var box = new THREE.Box3().setFromObject(object);
      var size = box.getSize(new THREE.Vector3());
      var maxDim = Math.max(size.x, size.y, size.z);
      var scale = maxDim > 0 ? 2.0 / maxDim : 1;

      object.scale.multiplyScalar(scale);
      var scaledBox = new THREE.Box3().setFromObject(object);
      var scaledCenter = scaledBox.getCenter(new THREE.Vector3());
      object.position.sub(scaledCenter);
      object.position.y -= scaledBox.min.y;

      scene.add(object);
      mesh = object;
      camera.position.set(3, 2, 3);
      controls.target.set(0, 0, 0);
      controls.update();
      hideLoading();
    }

    window.loadObjFromBridge = function() {
      try {
        var objText = AndroidBridge.getObjData();
        if (objText && objText.length > 0) {
          clearMesh();
          setLoading('Parsing model...');
          var loader = new THREE.OBJLoader();
          var object = loader.parse(objText);
          addModelToScene(object);
        } else {
          setLoading('No OBJ data received');
        }
      } catch(e) {
        setLoading('Error: ' + e.message);
      }
    };

    window.loadObjData = function(objText) {
      clearMesh();
      try {
        var loader = new THREE.OBJLoader();
        var object = loader.parse(objText);
        addModelToScene(object);
      } catch(e) {
        setLoading('Parse error: ' + e.message);
      }
    };

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    init();
</script>
</body>
</html>
